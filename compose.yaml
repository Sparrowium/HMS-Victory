services:
  # --------------------------------------------------------------------------
  # VictoriaMetrics – time‑series database
  # --------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    networks:
      - monitoring
      - proxy
    volumes:
      - ./storage/victoriametrics:/victoria-metrics-data
    command:
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=${VM_RETENTION_PERIOD}'
      - '-httpListenAddr=${VM_HTTP_LISTEN_ADDR}'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8428/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # VictoriaLogs – log storage
  # --------------------------------------------------------------------------
  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: victorialogs
    restart: unless-stopped
    networks:
      - monitoring
      - proxy
    volumes:
      - ./storage/victorialogs:/victoria-logs-data
    command:
      - '-storageDataPath=/victoria-logs-data'
      - '-httpListenAddr=${VLOG_HTTP_LISTEN_ADDR}'

  # --------------------------------------------------------------------------
  # vmagent – metrics scraper & forwarder
  # --------------------------------------------------------------------------
  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: vmagent
    restart: unless-stopped
    networks:
      - monitoring
      - proxy
    volumes:
      - ./vmagent.yml:/etc/vmagent/vmagent.yml:ro
    command:
      - '-promscrape.config=/etc/vmagent/vmagent.yml'
      - '-remoteWrite.url=http://victoriametrics:8428/api/v1/write'
    depends_on:
      - victoriametrics


  # --------------------------------------------------------------------------
  # Vector – log collector (ships to VictoriaLogs)
  # --------------------------------------------------------------------------
  vector:
    image: timberio/vector:nightly-debian
    container_name: vector
    restart: unless-stopped
    user: root                              # required for reading host logs & docker socket
    networks:
      - monitoring
      - proxy
    volumes:
      - ./vector.yml:/etc/vector/vector.yml:ro
      - /var/log:/var/log:ro
      - ./test-logs:/test-logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["--config", "/etc/vector/vector.yml"]

  # --------------------------------------------------------------------------
  # Node Exporter – host metrics
  # --------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    networks:
      - monitoring
      - proxy
    user: root
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.rapl'	

  # --------------------------------------------------------------------------
  # Grafana – dashboards
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - monitoring
      - proxy
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./storage/grafana-data:/var/lib/grafana
    depends_on:
      - victoriametrics	



# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  monitoring:
    driver: bridge
  proxy:
    external: true 
